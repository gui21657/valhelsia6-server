name: Validar configuracion y scripts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compose:
    name: Sintaxis de docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que el YAML es valido
        run: python3 -c "import yaml,sys; yaml.safe_load(open('docker-compose.yml')); print('YAML valido')"

      - name: Resolver el compose con los valores de .env.example
        run: |
          cp .env.example .env
          docker compose config

      - name: El compose no debe traer el EULA pre-aceptado
        run: |
          cp .env.example .env
          if docker compose config | grep -iE 'EULA:[[:space:]]*"?(TRUE|true)"?'; then
            echo "ERROR: el EULA no puede venir aceptado de fabrica." >&2
            exit 1
          fi
          echo "Correcto: el EULA queda en FALSE hasta que el usuario lo cambie."

  scripts:
    name: Sintaxis de los scripts de arranque
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la sintaxis de los scripts de shell
        run: |
          for s in $(git ls-files '*.sh'); do
            echo "bash -n $s"
            bash -n "$s"
          done

      - name: Analizar los scripts de shell con shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning $(git ls-files '*.sh')

      - name: Comprobar las unidades de systemd
        run: |
          # systemd-analyze verify se queja de dependencias que no existen en
          # el runner, asi que solo se valida que las secciones esten bien.
          for u in $(git ls-files 'despliegue/*.service' 'despliegue/*.timer'); do
            echo "revisando $u"
            grep -q '^\[Unit\]' "$u" || { echo "ERROR: $u sin seccion [Unit]" >&2; exit 1; }
            grep -qE '^\[(Service|Timer)\]' "$u" || { echo "ERROR: $u sin [Service] ni [Timer]" >&2; exit 1; }
          done
          echo "Unidades de systemd con la estructura correcta." 

      - name: Comprobar que los scripts de Windows existen y no estan vacios
        run: |
          test -s iniciar.bat
          test -s direccion.bat

  licencia:
    name: Sin archivos con copyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No puede haber jars ni zips en el repositorio
        run: |
          encontrados=$(git ls-files '*.jar' '*.zip' '*.mrpack')
          if [ -n "$encontrados" ]; then
            echo "ERROR: hay archivos que no se pueden redistribuir:" >&2
            echo "$encontrados" >&2
            exit 1
          fi
          echo "Correcto: no hay mods, modpacks ni jars en el repositorio."

      - name: No puede haber un .env real ni claves de CurseForge
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: el archivo .env no debe estar versionado." >&2
            exit 1
          fi
          if grep -rIn --exclude-dir=.git -E '\$2a\$10\$[A-Za-z0-9./]{20,}' .; then
            echo "ERROR: posible clave de API de CurseForge en el repositorio." >&2
            exit 1
          fi
          if grep -nE '^[[:space:]]*PLAYIT_SECRET_KEY[[:space:]]*=[[:space:]]*.+' .env.example; then
            echo "ERROR: PLAYIT_SECRET_KEY debe quedar vacio en .env.example." >&2
            exit 1
          fi
          echo "Correcto: sin .env versionado ni claves incrustadas."
